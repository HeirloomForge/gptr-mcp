version: '3.8'
services:
  gptr-mcp:
    build:
      context: .
    ports:
      - "8502:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      DOCKER_CONTAINER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}   # e.g., https://your-litellm.domain/v1
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    volumes:
      - /srv/gpt-mcp/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # The MCP server listens on 8000 (uvicorn in server.py); 8502 never
      # existed, so the container read "unhealthy" forever. `localhost`
      # also does not resolve inside the slim image, so probe 127.0.0.1.
      # No -f: any HTTP response (404 from FastMCP's unknown path included)
      # proves the HTTP server is up; connection failure is the real
      # failure.
      test: ["CMD", "curl", "-s", "-m", "5", "-o", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

