version: '3.8'
services:
  gptr-mcp:
    build:
      context: .
    ports:
      - "8502:8000"
    environment:
      MCP_TRANSPORT: sse
      DOCKER_CONTAINER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}   # e.g., https://your-litellm.domain/v1
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    volumes:
      - /srv/gpt-mcp/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

